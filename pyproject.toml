[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-privacy-guard"
version = "0.3.0"
description = "Read-only privacy review and human-facing recommendations"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.4", "ruff>=0.14", "PyYAML>=6.0"]
mcp = ["mcp>=2.3,<3"]
semantic = ["transformers[torch]>=4.57,<6"]

[project.scripts]
privacy-guard = "privacy_guard.cli:main"
privacy-guard-mcp = "privacy_guard.mcp_server:main"

[tool.setuptools.packages.find]
include = ["privacy_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [".venv", ".tools", ".git", ".pytest_cache", ".ruff_cache", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
